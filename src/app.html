<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f2f4" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0d0e" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<script>
			(function () {
				var s = localStorage.getItem('theme');
				var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
				if (s === 'dark' || (s !== 'light' && d)) document.documentElement.classList.add('dark');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript>
			<style>
				html,
				body {
					overflow: hidden;
				}
				.noscript-note {
					position: fixed;
					inset: 0;
					z-index: 2147483647;
					box-sizing: border-box;
					display: grid;
					place-items: center;
					padding: 24px;
					background: rgba(0, 0, 0, 0.9);
					-webkit-backdrop-filter: blur(24px);
					backdrop-filter: blur(24px);
					color: #f1f2f4;
					font-family:
						system-ui,
						-apple-system,
						sans-serif;
					font-size: 15px;
					line-height: 1.6;
					text-align: center;
				}
				.noscript-note__card {
					display: grid;
					justify-items: center;
					gap: 18px;
					max-width: 34rem;
				}
				.noscript-note__logo {
					width: 64px;
					height: 64px;
				}
				.noscript-note__title {
					margin: 0;
					font-size: 20px;
					font-weight: 650;
					letter-spacing: -0.01em;
				}
				.noscript-note p {
					margin: 0;
				}
			</style>
			<div class="noscript-note">
				<div class="noscript-note__card">
					<svg
						class="noscript-note__logo"
						viewBox="0 0 32 32"
						xmlns="http://www.w3.org/2000/svg"
						aria-hidden="true"
					>
						<rect width="32" height="32" rx="8" fill="#ffffff" />
						<g
							fill="none"
							stroke="#0b0c0e"
							stroke-width="2.6"
							stroke-linecap="butt"
							stroke-linejoin="miter"
						>
							<path d="M11 6.5l5 5 5-5" />
							<path d="M7 16h18" />
							<path d="M11 25.5l5-5 5 5" />
						</g>
					</svg>
					<p class="noscript-note__title">Compress Pro needs JavaScript</p>
					<p>
						The whole app runs in your browser — files are compressed on your device and never
						uploaded, so there is no server that could do the work instead. Enable JavaScript and
						reload the page.
					</p>
				</div>
			</div>
		</noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
